name: Android Check

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  public_repository:
    name: Public repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Test repository verifier
        run: python3 scripts/test_verify_public_repository.py
      - name: Test APK size reporter
        run: python3 scripts/test_report_apk_size.py
      - name: Test minified DEX size reporter
        run: python3 scripts/test_report_minified_dex_size.py
      - name: Verify tracked public content
        run: python3 scripts/verify_public_repository.py

  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Architecture
            command: ./gradlew --no-daemon -I gradle/architecture-metadata.gradle.kts -I gradle/table-ownership.gradle.kts verifyArchitecture
          - name: Test
            command: ./gradlew --no-daemon test
          - name: Lint
            command: ./gradlew --no-daemon :app:lintRelease
          - name: R8
            command: ./gradlew --no-daemon :app:minifyReleaseWithR8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools
      - name: Install Android SDK 37
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}
      - name: Compare minified DEX size with base
        if: matrix.name == 'R8'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          BASE_WORKTREE="$RUNNER_TEMP/dex-size-base"
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          git worktree add --detach "$BASE_WORKTREE" "$BASE_SHA"
          trap 'git worktree remove --force "$BASE_WORKTREE" >/dev/null 2>&1 || true' EXIT
          (
            cd "$BASE_WORKTREE"
            ./gradlew --no-daemon :app:minifyReleaseWithR8
          )
          python3 scripts/report_minified_dex_size.py \
            app/build/intermediates/dex/release/minifyReleaseWithR8 \
            --baseline-root "$BASE_WORKTREE/app/build/intermediates/dex/release/minifyReleaseWithR8" \
            --warning-percent 10
      - name: Upload test reports on failure
        if: failure() && matrix.name == 'Test'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-test-results
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**
          if-no-files-found: warn
          retention-days: 1
