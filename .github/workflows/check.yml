name: Android Check

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  public_repository:
    name: Public repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Test repository verifier
        run: python3 scripts/test_verify_public_repository.py
      - name: Test APK size reporter
        run: python3 scripts/test_report_apk_size.py
      - name: Verify tracked public content
        run: python3 scripts/verify_public_repository.py

  godot_project:
    name: Godot project
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download Godot 4.7.2
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/godot.zip" \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
      - name: Run Godot Sudoku headless
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/godot-sudoku.log"
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" \
            --headless \
            --path feature/game/ui/src/main/assets \
            --quit-after 5 \
            --verbose 2>&1 | tee "$LOG"
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Cannot load.*sudoku" "$LOG"; then
            echo "Godot project validation failed"
            exit 1
          fi

  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Architecture
            command: ./gradlew --no-daemon -I gradle/architecture-metadata.gradle.kts -I gradle/table-ownership.gradle.kts verifyArchitecture
          - name: Test
            command: ./gradlew --no-daemon test
          - name: Lint
            command: ./gradlew --no-daemon :app:lintRelease
          - name: R8
            command: ./gradlew --no-daemon :app:minifyReleaseWithR8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}
      - name: Report minified DEX size
        if: matrix.name == 'R8'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path("app/build/intermediates/dex/release/minifyReleaseWithR8")
          dex_files = sorted(root.rglob("*.dex"))
          if not dex_files:
              raise SystemExit(f"No minified DEX files found under {root}")

          rows = [(path, path.stat().st_size) for path in dex_files]
          total = sum(size for _, size in rows)
          print(f"Minified DEX total: {total} bytes")
          for path, size in rows:
              print(f"- {path}: {size} bytes")

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write(f"### Minified DEX size\n\nTotal: `{total}` bytes\n\n")
                  for path, size in rows:
                      handle.write(f"- `{path}`: `{size}` bytes\n")
          PY
      - name: Upload test reports on failure
        if: failure() && matrix.name == 'Test'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-test-results
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**
          if-no-files-found: warn
          retention-days: 1
