name: Apply pull-to-refresh migration

on:
  push:
    branches:
      - agent/pull-to-refresh

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/pull-to-refresh
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Apply source changes
        shell: bash
        run: |
          python3 .github/agent-pull-to-refresh.py
          target=core/designsystem/src/main/kotlin/dev/terashima/yomitorirss/core/designsystem/PullToRefreshContainer.kt
          sed -i 's/onRefresh = onRefresh,/onRefresh = { if (canRefresh) onRefresh() },/' "$target"
          sed -i '/    enabled = canRefresh,/d' "$target"
      - name: Test
        run: ./gradlew --no-daemon test
      - name: Lint
        run: ./gradlew --no-daemon :app:lintRelease
      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          rm .github/agent-pull-to-refresh.py .github/workflows/agent-pull-to-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "更新操作を pull-to-refresh に統一"
          git push origin HEAD:agent/pull-to-refresh
