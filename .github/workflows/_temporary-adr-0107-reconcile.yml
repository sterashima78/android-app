name: Temporary ADR 0107 reconciliation

on:
  push:
    branches:
      - agent/adr-integrity-validation
    paths:
      - scripts/reconcile_adr_0107_collision.py
      - .github/workflows/_temporary-adr-0107-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/adr-integrity-validation
          fetch-depth: 0

      - name: Refresh latest main
        run: git fetch origin main:refs/remotes/origin/main --force

      - name: Reconcile ADR 0107 collision
        run: python3 scripts/reconcile_adr_0107_collision.py

      - name: Validate ADR integrity
        shell: bash
        run: |
          set +e
          {
            echo "unit tests:"
            python3 -m unittest scripts.test_verify_adr_integrity
            unit_status=$?
            echo
            echo "repository verification:"
            python3 scripts/verify_adr_integrity.py
            verify_status=$?
            echo
            echo "git diff check:"
            git diff --check
            diff_status=$?
            echo
            if [ "$unit_status" -eq 0 ] && [ "$verify_status" -eq 0 ] && [ "$diff_status" -eq 0 ]; then
              echo "RESULT=PASS"
              exit_status=0
            else
              echo "RESULT=FAIL unit=$unit_status verify=$verify_status diff=$diff_status"
              exit_status=1
            fi
          } > scripts/.adr-validation-result.txt 2>&1
          cat scripts/.adr-validation-result.txt
          echo "exit_status=$exit_status" >> "$GITHUB_ENV"

      - name: Commit reconciliation result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Reconcile ADR numbering with latest main"
            git push origin HEAD:agent/adr-integrity-validation
          fi

      - name: Fail when validation failed
        run: exit "$exit_status"
