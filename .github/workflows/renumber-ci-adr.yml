name: Renumber CI ADR

on:
  push:
    branches:
      - ci/split-check-and-build
    paths:
      - .github/workflows/renumber-ci-adr.yml

permissions:
  contents: write

jobs:
  renumber:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ci/split-check-and-build
      - name: Renumber CI ADR
        run: python3 scripts/renumber_ci_adr_once.py
      - name: Commit ADR renumber
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "docs: renumber CI ADR"
          git push origin HEAD:ci/split-check-and-build
