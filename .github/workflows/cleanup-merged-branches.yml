name: Cleanup merged branches

on:
  schedule:
    # GitHub Actions cron is UTC. 17:00 UTC = 02:00 JST on the following day.
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: cleanup-merged-branches
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete stale branches
    runs-on: ubuntu-latest

    steps:
      - name: Delete closed-PR and PR-unassociated branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          repo="${GITHUB_REPOSITORY}"
          default_branch="${{ github.event.repository.default_branch }}"
          pulls_file="${RUNNER_TEMP}/pulls.json"
          branches_file="${RUNNER_TEMP}/branches.json"

          gh api --paginate -X GET "repos/${repo}/pulls?state=all&per_page=100" \
            | jq -s 'add' > "${pulls_file}"
          gh api --paginate -X GET "repos/${repo}/branches?per_page=100" \
            | jq -s 'add' > "${branches_file}"

          deleted_closed_pr_count=0
          deleted_unassociated_count=0
          skipped_count=0

          while IFS= read -r branch_json; do
            branch="$(jq -r '.name' <<< "${branch_json}")"
            protected="$(jq -r '.protected' <<< "${branch_json}")"

            if [[ "${branch}" == "${default_branch}" || "${protected}" == "true" ]]; then
              skipped_count=$((skipped_count + 1))
              continue
            fi

            if jq -e \
              --arg repo "${repo}" \
              --arg branch "${branch}" \
              'any(.[]; .state == "open" and .head.repo.full_name == $repo and .head.ref == $branch)' \
              "${pulls_file}" >/dev/null; then
              echo "Skip ${branch}: an open pull request still uses this branch."
              skipped_count=$((skipped_count + 1))
              continue
            fi

            closed_pr_number="$(
              jq -r \
                --arg repo "${repo}" \
                --arg branch "${branch}" \
                '[
                  .[]
                  | select(
                      .state == "closed"
                      and .head.repo.full_name == $repo
                      and .head.ref == $branch
                    )
                ]
                | sort_by(.closed_at)
                | last
                | .number // empty' \
                "${pulls_file}"
            )"

            if [[ -n "${closed_pr_number}" ]]; then
              echo "Delete ${branch}: associated pull request #${closed_pr_number} is closed."
              gh api --method DELETE "repos/${repo}/git/refs/heads/${branch}"
              deleted_closed_pr_count=$((deleted_closed_pr_count + 1))
              continue
            fi

            echo "Delete ${branch}: no pull request has ever used this branch name."
            gh api --method DELETE "repos/${repo}/git/refs/heads/${branch}"
            deleted_unassociated_count=$((deleted_unassociated_count + 1))
          done < <(jq -c '.[]' "${branches_file}")

          deleted_count=$((deleted_closed_pr_count + deleted_unassociated_count))

          {
            echo "### Branch cleanup"
            echo
            echo "- Deleted: ${deleted_count}"
            echo "  - Branches associated with closed PRs: ${deleted_closed_pr_count}"
            echo "  - Branches never associated with a PR: ${deleted_unassociated_count}"
            echo "- Skipped: ${skipped_count}"
            echo
            echo "Branches are kept only when they are the default/protected branch or are currently used by an open pull request."
            echo "Closed-PR and PR-unassociated branches are deleted regardless of commits that are not present on ${default_branch}."
          } >> "${GITHUB_STEP_SUMMARY}"
