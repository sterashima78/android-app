name: Patch CI docs

on:
  push:
    branches:
      - ci/split-check-and-build
    paths:
      - .github/workflows/patch-ci-docs.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ci/split-check-and-build
      - name: Patch current architecture docs
        run: python3 scripts/patch_ci_docs_once.py
      - name: Commit documentation updates
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/architecture/testing.md docs/adr/0164-p1-owner-boundary-and-main-quality-gate.md docs/adr/README.md
          git diff --cached --check
          git commit -m "docs: align CI documentation with split workflows"
          git push origin HEAD:ci/split-check-and-build
