name: Temporary ADR renumber

on:
  push:
    branches:
      - agent/adr-integrity-validation
    paths:
      - scripts/renumber_adr_collisions.py
      - .github/workflows/_temporary-adr-renumber.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: agent/adr-integrity-validation

      - name: Renumber collided ADRs
        run: python3 scripts/renumber_adr_collisions.py

      - name: Check patch whitespace
        run: git diff --check

      - name: Commit migration result
        shell: bash
        run: |
          if git diff --quiet; then
            echo "ADR migration already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Resolve ADR numbering collisions"
          git push origin HEAD:agent/adr-integrity-validation
