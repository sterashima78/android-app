name: Temporary ADR renumber

on:
  push:
    branches:
      - agent/adr-integrity-validation
    paths:
      - scripts/renumber_adr_collisions.py
      - .github/workflows/_temporary-adr-renumber.yml

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: agent/adr-integrity-validation

      - name: Apply migration idempotently
        run: python3 scripts/renumber_adr_collisions.py

      - name: Normalize legacy ADR headings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          fixes = {
              "docs/adr/0024-task-home-screen-widget.md": ("# ADR 0024:", "# ADR-0024:"),
              "docs/adr/0038-android-test-layers-and-e2e.md": ("# ADR 0038:", "# ADR-0038:"),
          }
          for filename, (old, new) in fixes.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              if text.startswith(old):
                  path.write_text(new + text[len(old):], encoding="utf-8")
          PY

      - name: Run ADR tests and repository verification
        shell: bash
        run: |
          set +e
          {
            echo "unit tests:"
            python3 -m unittest scripts.test_verify_adr_integrity
            unit_status=$?
            echo
            echo "repository verification:"
            python3 scripts/verify_adr_integrity.py
            verify_status=$?
            echo
            echo "git diff check:"
            git diff --check
            diff_status=$?
            echo
            if [ "$unit_status" -eq 0 ] && [ "$verify_status" -eq 0 ] && [ "$diff_status" -eq 0 ]; then
              echo "RESULT=PASS"
              exit_status=0
            else
              echo "RESULT=FAIL unit=$unit_status verify=$verify_status diff=$diff_status"
              exit_status=1
            fi
          } > scripts/.adr-validation-result.txt 2>&1
          cat scripts/.adr-validation-result.txt
          echo "exit_status=$exit_status" >> "$GITHUB_ENV"

      - name: Commit validation result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Normalize ADR headings and validate numbering"
            git push origin HEAD:agent/adr-integrity-validation
          fi

      - name: Fail when validation failed
        shell: bash
        run: exit "$exit_status"
