name: Temporary sync latest main

on:
  push:
    branches:
      - agent/adr-integrity-validation
    paths:
      - .github/workflows/_temporary-sync-main.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/adr-integrity-validation
          fetch-depth: 0

      - name: Merge latest main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main:refs/remotes/origin/main --force
          git merge --no-commit --no-ff -X ours origin/main

      - name: Validate merged ADR namespace
        run: |
          python3 -m unittest scripts.test_verify_adr_integrity
          python3 scripts/verify_adr_integrity.py
          git diff --cached --check

      - name: Remove temporary workflow and publish merge
        shell: bash
        run: |
          git rm .github/workflows/_temporary-sync-main.yml
          git add -A
          git commit -m "Merge latest main and resolve ADR numbering"
          git push origin HEAD:agent/adr-integrity-validation
